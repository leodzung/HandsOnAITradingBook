name: Polymarket Constraint Validation

on:
  push:
    branches: [ master, main ]
    paths:
      - '12 Polymarket Event Impact Trading/**/*.py'
      - '12 Polymarket Event Impact Trading/CONSTRAINTS.yml'
      - '12 Polymarket Event Impact Trading/tests/**'
      - '12 Polymarket Event Impact Trading/scripts/validate_constraints.py'
  pull_request:
    branches: [ master, main ]
    paths:
      - '12 Polymarket Event Impact Trading/**/*.py'
      - '12 Polymarket Event Impact Trading/CONSTRAINTS.yml'
      - '12 Polymarket Event Impact Trading/tests/**'
      - '12 Polymarket Event Impact Trading/scripts/validate_constraints.py'
  workflow_dispatch:

jobs:
  validate-constraints:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd "12 Polymarket Event Impact Trading"
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run constraint validation
      run: |
        cd "12 Polymarket Event Impact Trading"
        python scripts/validate_constraints.py --ci

    - name: Upload validation report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: constraint-validation-report
        path: 12 Polymarket Event Impact Trading/constraint_validation_report.txt
        retention-days: 30

  run-structural-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd "12 Polymarket Event Impact Trading"
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run structural tests
      run: |
        cd "12 Polymarket Event Impact Trading"
        pytest tests/structural/ -v --cov=src --cov-report=term-missing

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: structural-test-results
        path: 12 Polymarket Event Impact Trading/pytest-report.xml
        retention-days: 30
