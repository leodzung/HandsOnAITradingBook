[tool.poetry]
name = "agentic-portfolio-management"
version = "0.1.0"
description = "AI-powered multi-agent portfolio management system"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core frameworks
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# Agent frameworks (choose one or use both)
langchain = "^0.1.0"
langchain-openai = "^0.0.2"
langchain-anthropic = "^0.0.1"
langgraph = "^0.0.20"
# crewai = "^0.1.0"  # Alternative to langchain+langgraph

# LLM Providers
openai = "^1.10.0"
anthropic = "^0.8.0"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.0"
alembic = "^1.13.0"

# Caching and message bus
redis = {extras = ["hiredis"], version = "^5.0.0"}
aioredis = "^2.0.0"

# Data processing
pandas = "^2.1.0"
numpy = "^1.26.0"
scipy = "^1.11.0"

# Financial data and calculations
yfinance = "^0.2.0"
ta-lib = "^0.4.0"  # Technical analysis
quantstats = "^0.0.62"  # Portfolio analytics

# Brokerage integrations
robin-stocks = "^3.0.0"  # Robinhood unofficial API
alpaca-trade-api = "^3.0.0"  # Alpaca official API
ib-insync = "^0.9.86"  # Interactive Brokers official API
pytz = "^2023.3"  # Timezone support for market hours

# Security for credentials
keyring = "^24.3.0"  # Secure credential storage
cryptography = "^41.0.0"  # Encryption utilities

# Rate limiting
ratelimit = "^2.2.1"  # API rate limiting

# Caching
cachetools = "^5.3.0"  # In-memory caching

# QuantConnect (if available via pip, otherwise custom)
# lean = "^1.0.0"  # QuantConnect LEAN CLI

# Web UI
streamlit = "^1.30.0"
plotly = "^5.18.0"
altair = "^5.2.0"

# HTTP client
httpx = "^0.26.0"
aiohttp = "^3.9.0"

# Configuration
python-dotenv = "^1.0.0"
pyyaml = "^6.0.0"

# Monitoring and logging
prometheus-client = "^0.19.0"
structlog = "^24.1.0"
python-json-logger = "^2.0.0"

# Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
httpx = "^0.26.0"  # For testing FastAPI

# Code quality
black = "^23.12.0"
ruff = "^0.1.0"
mypy = "^1.8.0"
isort = "^5.13.0"

# Type stubs
types-redis = "^4.6.0"
types-pyyaml = "^6.0.0"
pandas-stubs = "^2.1.0"

# Development tools
ipython = "^8.19.0"
ipdb = "^0.13.0"
jupyter = "^1.0.0"

[tool.poetry.scripts]
agentic-pm = "src.api.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "streamlit.*",
    "plotly.*",
    "yfinance.*",
    "quantstats.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
addopts = "-v --strict-markers --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
