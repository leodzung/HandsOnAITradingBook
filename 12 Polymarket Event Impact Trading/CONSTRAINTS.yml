version: '1.0'
constraints:
  architecture:
  - id: ARCH-001
    title: PriceFetcher is single source of truth for price data
    description: 'All price data MUST flow through src/core/price_fetcher.py.

      Direct access to market[''bestBid''], market[''bestAsk''], or

      market[''outcomePrices''] is FORBIDDEN to prevent price confusion bugs.

      '
    rationale: 'Historical bug: YES/NO price confusion caused incorrect P&L calculations.

      PriceFetcher provides correct ASK (entry) and BID (exit) prices with

      built-in safety checks.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-13'
    validation:
    - type: import_linter
      rule: forbid_direct_market_price_access
      description: No code outside price_fetcher.py can access market price fields
        directly
      files_to_check:
      - src/bots/trader.py
      - src/bots/trader_price_levels.py
      - src/bots/trader_short_expiry.py
      - src/core/trade_executor.py
      forbidden_patterns:
      - market\['bestBid'\]
      - market\['bestAsk'\]
      - market\['outcomePrices'\]
      - market\.get\('bestBid'\)
      - market\.get\('bestAsk'\)
      allowed_files:
      - src/core/price_fetcher.py
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_price_fetcher_constraint.py
        -v
      description: Verify all bots use PriceFetcher methods
    telemetry:
    - metric: direct_market_access_violations
      threshold: 0
      alert: critical
      description: Count of code patterns that bypass PriceFetcher
  - id: ARCH-002
    title: PositionManager V2 is single source for position data
    description: 'All position operations MUST use src/core/position_manager.py (V2).

      Direct SQLite access or separate implementations are FORBIDDEN.

      '
    rationale: 'Eliminated 500+ lines of duplicate code across 3 bots (2026-02-14).

      V2 provides unified interface, backward compatibility, and consistent tracking.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-14'
    validation:
    - type: import_linter
      rule: forbid_direct_sqlite_access
      files_to_check:
      - src/bots/trader.py
      - src/bots/trader_price_levels.py
      - src/bots/trader_short_expiry.py
      forbidden_patterns:
      - import sqlite3
      - sqlite3\.connect
      allowed_files:
      - src/core/position_manager.py
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_position_manager_constraint.py
        -v
  - id: ARCH-003
    title: Common features centralized in common_features.py
    description: 'Orderbook, volume, and time features MUST be extracted from

      src/ml/common_features.py classes (OrderbookFeatures, VolumeFeatures, TimeFeatures).

      Duplicate implementations are FORBIDDEN.

      '
    rationale: 'Eliminated 650 lines of duplicate code (2026-02-14).

      Ensures consistency, enables single-point bug fixes, reduces maintenance by
      67%.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-14'
    validation:
    - type: code_duplication_check
      command: python3 scripts/check_feature_duplication.py
      max_duplicate_lines: 10
    - type: structural_test
      command: PYTHONPATH=src pytest tests/test_common_features.py -v
    telemetry:
    - metric: feature_extraction_failures
      threshold: 0
      alert: warning
  - id: ARCH-004
    title: WebSocket orderbook with REST fallback
    description: 'OrderbookManager MUST use WebSocket (real-time) as primary source,

      with automatic fallback to REST (synthetic) if WebSocket unavailable.

      Bots MUST register markets for WebSocket subscriptions.

      '
    rationale: 'WebSocket provides <100ms real-time orderbook data.

      REST /book endpoint is BROKEN (returns stale data).

      Fallback ensures reliability during connection issues.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-13'
    validation:
    - type: integration_test
      command: PYTHONPATH=src pytest tests/integration/test_orderbook_manager.py -v
    - type: behavioral_test
      command: PYTHONPATH=src pytest tests/behavioral/test_websocket_fallback.py -v
    telemetry:
    - metric: websocket_fallback_rate
      threshold: 0.2
      alert: warning
      description: Alert if >20% of requests use fallback (indicates connection issues)
    - metric: websocket_reconnect_count
      alert_on_spike: true
      spike_threshold: 5
      window_minutes: 60
  - id: ARCH-005
    title: All position operations must go through TradeExecutor
    description: 'Opening AND closing positions MUST use TradeExecutor to ensure consistent
      validation:

      - Opening: trade_executor.execute_trade(request, order_side=''BUY'')

      - Closing: trade_executor.execute_close_trade(...)


      Direct calls to position_manager.open_position() or position_manager.close_position()

      from bot code are FORBIDDEN (bypasses slippage validation, price checks, risk
      limits).


      Exception: TradeExecutor itself can call position_manager directly.

      '
    rationale: 'Bug found 2026-02-27: trader_price_levels.py closed positions without
      slippage checks,

      assuming infinite liquidity. Would cause severe losses in live trading.


      TradeExecutor provides centralized validation pipeline that must not be bypassed.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-27'
    validation:
    - type: import_linter
      rule: forbid_direct_position_manager_calls
      files_to_check:
      - src/bots/trader.py
      - src/bots/trader_price_levels.py
      - src/bots/trader_short_expiry.py
      forbidden_patterns:
      - position_manager\.close_position\(
      - position_manager\.save_position\(
      allowed_files:
      - src/core/trade_executor.py
      - tests/
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_trade_executor_constraint.py
        -v
    telemetry:
    - metric: direct_position_manager_calls
      threshold: 0
      alert: critical
      description: Count of direct position_manager calls from bot code
  - id: ARCH-006
    title: PositionSizer is single source for position sizing
    description: 'All position sizing MUST use src/core/position_sizer.py.

      Inline Kelly calculations, hardcoded sizing, or per-bot sizing methods are FORBIDDEN.

      '
    rationale: 'Three bots had inconsistent sizing formulas (2026-02-27). Event trader

      used fake Kelly (balance*0.1*confidence), price-level used real Kelly, short-expiry

      used max_size*confidence with no balance/edge consideration. Unified PositionSizer

      provides consistent Kelly + liquidity caps across all bots.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-27'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/test_position_sizer.py -v
      description: Verify PositionSizer Kelly, confidence, liquidity, and cap logic
  - id: ARCH-007
    title: Per-bucket config values must be resolved before comparison
    description: 'Config values that may be per-bucket dicts (e.g., max_slippage_bps,

      max_slippage_dollars, warn_threshold_bps) MUST NOT be compared directly

      to numeric values. All such values MUST go through _resolve() or equivalent

      to extract the scalar for the current bucket before any > < >= <= comparison.

      '
    rationale: 'Bug 2026-02-28: SlippageEstimator stored per-bucket dict config values

      and compared them directly to floats (e.g., slippage_bps > self.max_slippage_bps

      where max_slippage_bps was a dict). Caused TypeError crash in main trading loop.

      This pattern will recur anywhere config supports both scalar and per-bucket
      formats.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-28'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_config_type_safety.py -v
      description: AST scan ensures dict-capable config attrs are never in raw comparisons
  - id: ARCH-008
    title: No synthetic NO price calculation from YES price
    description: 'Bot code MUST NOT compute NO price as (1.0 - yes_price) or (1 -
      market_price).

      YES and NO prices MUST be fetched independently from PriceFetcher because

      YES + NO != 1.0 due to market maker spread. Synthetic calculation creates

      dead code (arbitrage check can never fire) and incorrect price assumptions.

      '
    rationale: 'Short-expiry arbitrage rule computed no_price = 1.0 - market_price,

      making total = yes + (1 - yes) = 1.0 always. The check "if total < 0.98"

      could never fire - pure dead code. Price-level bot had same pattern in

      conditional analysis. Real YES+NO typically = 1.03-1.10 due to spread.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-28'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_independent_prices.py -v
      description: Regex scan ensures no synthetic NO price patterns in bot files
  - id: ARCH-009
    title: Thread-safe shared state in orderbook modules
    description: 'All mutable shared state in orderbook modules MUST be protected
      by locks.

      Stats MUST use _inc_stat() (not direct self.stats[key] += 1).

      _ws_client access outside __init__ MUST be under _ws_lock.

      Cache access in OrderbookServiceClient MUST be under _cache_lock.

      _initialized in SharedOrderbookManager MUST be read under _lock.

      '
    rationale: 'Commit d6356bd fixed 5 thread safety races (#1, #2, #3, #19, #20).

      Direct stat mutation from multiple threads causes lost increments.

      Unprotected _ws_client access causes use-after-None crashes during reconnect.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-03-01'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_orderbook_thread_safety.py
        -v
      description: Verify thread-safe patterns in all orderbook modules
  - id: ARCH-012
    title: No hardcoded sleeps for connection waiting
    description: 'Orderbook modules MUST use wait_for_connection() or similar event-based

      waiting instead of hardcoded time.sleep() calls for connection readiness.

      time.sleep() in _start_websocket is FORBIDDEN.

      '
    rationale: 'Commit d6356bd fixed issue #6 where time.sleep(2) was used instead

      of wait_for_connection(). Hardcoded sleeps are fragile (too short on slow

      networks, wasteful on fast ones) and cause flaky tests.

      '
    status: enforced
    priority: high
    implemented_date: '2026-03-01'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_orderbook_no_hardcoded_sleep.py
        -v
      description: Verify no hardcoded sleeps in connection startup
  - id: ARCH-013
    title: Bounded caches and collections in orderbook modules
    description: 'All caches and collections in orderbook modules MUST have maximum

      size limits to prevent unbounded memory growth. REST cache MUST have

      _cache_max_size with eviction. WebSocket _order_books MUST have

      _max_order_books limit. Opportunity logs MUST use deque(maxlen=).

      '
    rationale: 'Commit d6356bd fixed issues #8, #9, #10 where unbounded dicts and

      lists grew without limit. In production, 10,000+ markets could cause OOM.

      '
    status: enforced
    priority: high
    implemented_date: '2026-03-01'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_orderbook_bounded_collections.py
        -v
      description: Verify all orderbook collections have size bounds
  - id: ARCH-015
    title: Arbitrage checks must use BID prices, not ASK
    description: 'The short-expiry arbitrage rule (YES + NO < threshold) MUST use
      BID prices from get_exit_prices(), NOT ASK prices from get_entry_prices().

      Rationale: arbitrage profit is realised by selling into the BID. Checking ASK
      prices inflates the total above 1.0 and can never produce a valid arb signal.

      Any None BID price must short-circuit the check (skip, do not trade).

      '
    rationale: "Bug fixed 2026-03-06 (C5): arbitrage used get_entry_prices() (ASK).\n\
      YES_ask + NO_ask is typically 1.03-1.10 due to spread, so the check \"if total\
      \ < 0.98\" could never fire \u2014 pure dead code with wrong prices.\n"
    status: enforced
    priority: critical
    implemented_date: '2026-03-06'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_arbitrage_bid_prices.py
        -v
      description: Verify arbitrage check calls get_exit_prices(), not get_entry_prices()
    forbidden_patterns:
    - get_entry_prices.*arb
    - '# arbitrage.*get_entry'
    files_to_check:
    - src/bots/trader_short_expiry.py
  - id: ARCH-016
    title: Feature extractors must return None for uncomputable markets; callers must
      skip
    description: 'Feature extractor methods (TimeDecayFeatures.extract, OrderbookFeatures.extract)
      MUST return None when they cannot compute meaningful features (missing end_date,
      empty orderbook). Defaulting to plausible-looking values (e.g. +24h expiry,
      mid_price=0.5) is FORBIDDEN because it silently poisons ML training data.

      Callers MUST check for None/empty DataFrame and skip the market rather than
      trading on fabricated features.

      '
    rationale: "Bugs fixed 2026-03-06 (C4, H4):\n- TimeDecayFeatures defaulted missing\
      \ end_date to now+24h \u2014 wrong expiry bucket.\n- OrderbookFeatures returned\
      \ mid_price=0.5 for empty books \u2014 pollutes ML data.\nFabricated features\
      \ look valid and enter the training dataset, degrading models.\n"
    status: enforced
    priority: critical
    implemented_date: '2026-03-06'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_feature_none_returns.py
        -v
      description: Verify feature extractors return None for missing/empty inputs
    telemetry:
    - metric: features_skipped_missing_data
      threshold: null
      alert: info
      description: Count of markets skipped due to uncomputable features (expected
        non-zero)
  - id: ARCH-017
    title: Position loop must use .get() for all DB-derived fields and validate before
      use
    description: 'In _check_positions(), every field read from a position dict MUST
      use .get() (never direct dict access) and MUST validate for None before use:

      - entry_time: skip with WARNING if None

      - hours_to_expiry_at_entry: force-close with _execute_close() if None

      - size: force-close with _execute_close() if <= 0 or None

      - current_price: skip exit check with WARNING if None

      Direct dict access (pos["field"]) is FORBIDDEN for optional DB columns.

      '
    rationale: "Bugs fixed 2026-03-06 (C1, C2, C3, H1):\n- C1: pos[\"entry_time\"\
      ] crashed for legacy positions missing the field.\n- C2: current_price=None\
      \ passed to should_exit() caused TypeError.\n- C3: hours_to_expiry=None defaulted\
      \ to 0, skipping expiry check \u2014 position stuck open.\n- H1: size=0 produced\
      \ wrong P&L (tokens_held = 0/0 = ZeroDivisionError).\nSQLite rows can have NULL\
      \ for any nullable column; direct access is always unsafe.\n"
    status: enforced
    priority: critical
    implemented_date: '2026-03-06'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_position_loop_field_access.py
        -v
      description: AST scan verifies no direct pos["field"] for optional columns in
        _check_positions
    forbidden_patterns:
    - pos\[.entry_time.\]
    - pos\[.hours_to_expiry_at_entry.\]
    - pos\[.size.\]
    files_to_check:
    - src/bots/trader_short_expiry.py
    - src/bots/trader.py
    - src/bots/trader_price_levels.py
  - id: ARCH-014
    title: Code quality standards in orderbook modules
    description: 'Orderbook modules MUST NOT contain bare except clauses, print()

      statements outside __main__ guard, or private attribute access from

      the service layer. These patterns indicate incomplete error handling,

      debug leftovers, and broken encapsulation respectively.

      '
    rationale: 'Commit d6356bd fixed issues #11, #12, #13, #17 covering bare except

      (swallows errors silently), print statements (bypasses logging), and

      service accessing manager private attributes (breaks encapsulation).

      '
    status: enforced
    priority: medium
    implemented_date: '2026-03-01'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_orderbook_code_quality.py
        -v
      description: Verify code quality standards in orderbook modules
  - id: ARCH-010
    title: TradeExecutor must not mutate TradeRequest inputs
    description: 'execute_trade() MUST NOT modify request.entry_price or any other
      field on the TradeRequest dataclass. Slippage-adjusted execution prices MUST
      be tracked via a local variable (execution_price) and passed explicitly to _execute_position()
      and TradeResult.

      Mutating caller inputs is a hidden side effect that breaks caller assumptions.

      '
    rationale: 'Bug 2026-02-28: execute_trade() mutated request.entry_price = recommended_price
      on line 178. Callers that inspected request after the call would see the slippage-adjusted
      price instead of their original quoted price. This violated the principle of
      least surprise and could cause incorrect logging/tracking.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-28'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_trade_executor_immutability.py
        -v
      description: Verify execute_trade does not mutate request fields
  - id: ARCH-011
    title: execute_close_trade must accept bucket for per-bucket thresholds
    description: 'execute_close_trade() MUST accept a bucket parameter and pass it
      to SlippageEstimator.estimate_slippage(). Without bucket, per-bucket configs
      (short-expiry bot) fall back to max(all_buckets), bypassing the intended per-bucket
      slippage limits on exit trades.

      '
    rationale: 'Bug 2026-02-28: Short-expiry bot had per-bucket slippage thresholds
      (ultra_short: 3000bps, short: 2000bps, medium: 1500bps) but execute_close_trade
      never passed bucket to estimate_slippage. All close trades used the most permissive
      threshold (3000bps) regardless of actual bucket.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-28'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_close_trade_bucket.py -v
      description: Verify execute_close_trade passes bucket to estimate_slippage
  risk_management:
  - id: RISK-001
    title: Stop-loss and take-profit always active
    description: 'All positions MUST have stop-loss and take-profit thresholds set.

      Position monitoring thread MUST check every 60 seconds.

      No position can remain open without exit criteria.

      '
    rationale: 'Prevents unlimited losses and ensures profit capture.

      Background thread provides 24/7 monitoring even during main loop pauses.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-01-31'
    validation:
    - type: integration_test
      command: PYTHONPATH=src pytest tests/integration/test_position_monitoring.py::TestStopLossTakeProfitEnforcement::test_sl_tp_always_set
        -v
    telemetry:
    - metric: positions_without_sl_tp
      threshold: 0
      alert: critical
      description: Count of open positions missing SL/TP
    - metric: position_monitoring_thread_alive
      threshold: 1
      alert: critical
      description: 'Binary: 1=alive, 0=dead'
  - id: RISK-002
    title: Circuit breaker after 3 consecutive losses
    description: 'Trading MUST pause after 3 consecutive losing trades.

      Cooldown period: 4 hours (configurable).

      Auto-resume after cooldown with consecutive_losses reset to 0.

      '
    rationale: 'Prevents drawdown cascades during adverse market conditions.

      Gives time to investigate issues before resuming trading.

      '
    status: enforced
    priority: high
    implemented_date: '2026-01-24'
    validation:
    - type: behavioral_test
      command: PYTHONPATH=src pytest tests/behavioral/test_circuit_breaker.py -v
    telemetry:
    - metric: circuit_breaker_trips
      alert_on_change: true
      alert: warning
      description: Alert when circuit breaker activates
    - metric: consecutive_losses
      threshold: 3
      alert: info
  - id: RISK-003
    title: Slippage estimation before order execution
    description: 'All trades (opening AND closing) MUST pass slippage estimation before
      submission.

      **Opening positions (BUY orders)**: Validates slippage when buying YES/NO tokens

      **Closing positions (SELL orders)**: Validates slippage when selling tokens
      back


      Rejection criteria (per-bot thresholds):

      - Event trader: slippage > 250 bps (2.5%)

      - Price-level trader: slippage > 2000 bps (20%)

      - Short-expiry trader: slippage > 1500-3000 bps (15-30%, bucket-dependent)


      Other rejections: insufficient liquidity, empty orderbook, stale orderbook (>10s),
      invalid prices, excessive volume.

      Warnings: liquidity < $500, spread > 5%, depth < 3 levels.

      '
    rationale: 'Prevents execution at unfavorable prices for both entries and exits.

      Ensures sufficient liquidity for position opening and closing.

      Per-bot thresholds reflect different market conditions and liquidity profiles.

      Critical for live trading to avoid losses from poor exit execution.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-09'
    validation:
    - type: integration_test
      command: PYTHONPATH=src pytest tests/integration/test_slippage_estimation.py
        -v
    - type: structural_test
      command: PYTHONPATH=src pytest tests/test_slippage_estimator.py -v
    telemetry:
    - metric: slippage_rejection_rate
      threshold: 0.3
      alert: warning
      description: Alert if >30% trades rejected for slippage (may need threshold
        adjustment)
    - metric: actual_slippage_avg
      threshold: 0.0025
      alert: warning
      description: Average slippage in executed trades (250 bps threshold for event
        trader)
  - id: RISK-004
    title: Market cooldown prevents over-trading
    description: 'Bots MUST enforce cooldown before re-entering closed positions.

      Short-expiry bot: 1-4h cooldown (bucket-dependent).

      Prevents churning same markets repeatedly.

      '
    rationale: 'Prevents over-trading losses from rapid re-entry.

      Historical data: Same markets traded 5-11x without cooldown, causing $241 loss.

      Cooldown gives markets time to stabilize after position close.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-26'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_market_cooldown.py -v
    - type: behavioral_test
      command: PYTHONPATH=src pytest tests/behavioral/test_no_rapid_reentry.py -v
    telemetry:
    - metric: cooldown_violations
      threshold: 0
      alert: critical
      description: Number of positions opened within cooldown period
    - metric: avg_trades_per_market
      threshold: 3
      alert: warning
      description: Average trades per market (should be 1-2 with cooldown)
  - id: RISK-005
    title: Minimum expiry time at entry
    description: 'Bots MUST NOT enter positions too close to expiry.

      Short-expiry bot: minimum 4 hours to expiry at entry.

      Prevents entries with insufficient time to profit.

      '
    rationale: 'Entering < 2h before expiry had 28.9% of trades with 20.4% win rate.

      Markets near expiry have low liquidity and high volatility.

      Positions need minimum time to reach take-profit.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-26'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_minimum_expiry.py -v
    telemetry:
    - metric: entries_under_min_expiry
      threshold: 0
      alert: critical
      description: Number of positions opened with < 4h to expiry
    - metric: avg_hours_at_entry
      threshold: 12
      alert: warning
      description: Average hours to expiry at position entry
  - id: RISK-006
    title: Minimum balance protection
    description: 'Bots MUST pause new trades when balance falls below minimum.

      Minimum threshold: $50 (configurable per bot).

      Existing positions still monitored for exit.

      '
    rationale: 'Prevents trading with insufficient capital for proper position sizing.

      Protects remaining balance from complete depletion.

      Short-expiry bot continued trading at $48 balance before fix.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-26'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_balance_protection.py -v
    telemetry:
    - metric: trades_below_min_balance
      threshold: 0
      alert: critical
      description: Number of trades executed below minimum balance
    - metric: balance_pauses
      threshold: null
      alert: warning
      description: Number of times trading paused due to low balance
  - id: RISK-007
    title: Sufficient balance validation before trade
    description: 'Bots MUST verify sufficient balance before opening positions.

      Check: balance >= position_size before deducting capital.

      Reject and log trades that would overdraw the account.

      '
    rationale: 'Prevents account overdraw and balance tracking corruption.

      Historical bug: Bot opened $2,604 in positions with only $500 balance,

      causing $217 balance tracking discrepancy. Balance went from expected

      $265 to actual $48 (44% loss from tracking bug).

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-26'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_sufficient_balance.py -v
    - type: behavioral_test
      command: PYTHONPATH=src pytest tests/behavioral/test_no_overdraw.py -v
    telemetry:
    - metric: rejected_trades_insufficient_balance
      threshold: null
      alert: info
      description: Number of trades rejected due to insufficient balance
    - metric: negative_balance_events
      threshold: 0
      alert: critical
      description: Number of times balance went negative
  - id: RISK-008
    title: Symmetric test coverage for BUY/SELL operations
    description: 'For every BUY order test scenario, there MUST be a corresponding
      SELL order test.


      Required parity (minimum 80% ratio):

      - Large order multi-level: BUY + SELL

      - Insufficient liquidity: BUY + SELL

      - Wide spread: BUY + SELL

      - Invalid inputs: BUY + SELL

      - Slippage threshold: BUY + SELL


      Ratio = SELL_tests / BUY_tests >= 0.8

      '
    rationale: 'Asymmetric test coverage (12 BUY tests, 1 SELL test) allowed SELL
      order bugs

      to go undetected during slippage estimator development.


      Markets behave differently for bid vs ask consumption - both must be tested
      equally.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-27'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_buy_sell_parity.py -v
    telemetry:
    - metric: buy_sell_test_ratio
      threshold: 0.8
      alert: warning
      description: Ratio of SELL to BUY tests should be >= 80%
  - id: RISK-009
    title: Configuration validation at startup
    description: 'All bots MUST validate configuration parameters at startup before
      trading:


      Slippage thresholds:

      - min: 50 bps (markets tighter than this don''t exist)

      - max: 5000 bps (50% - anything higher likely config error)

      - warn: <200 bps (may block valid trades) or >3000 bps (too permissive)


      Position sizing:

      - min_position_size > 0

      - max_position_size < account_balance

      - max_position_size >= min_position_size


      Stop-loss/Take-profit:

      - stop_loss_pct: 1-50%

      - take_profit_pct: 1-100%


      Raise ConfigurationError and refuse to start if invalid.

      '
    rationale: 'Event trader had max_slippage_bps=100 (blocked all trades in normal
      spreads).

      Price-level trader had max_slippage_bps=12000 (would accept 120% slippage!).

      No validation caught these dangerous misconfigurations.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-28'
    validation:
    - type: integration_test
      command: PYTHONPATH=src pytest tests/integration/test_config_validation.py -v
    telemetry:
    - metric: config_validation_failures
      threshold: 0
      alert: critical
      description: Number of times bot startup blocked by invalid config
  - id: RISK-011
    title: ExposureManager enforced across all bots
    description: 'All trading bots MUST use ExposureManager for portfolio concentration
      limits.

      Each bot MUST import ExposureManager, initialize it with config, and check can_open_position()
      before opening any position.

      Each bot config MUST have an exposure_limits section.

      '
    rationale: 'Only 1 of 3 bots had ExposureManager (price-level bot). Event and
      short-expiry bots had no concentration or capital deployment limits, risking
      portfolio over-concentration.

      ExposureManager provides 6-layer defense: per-asset count, per-asset capital,
      directional balance, strike clustering, expiry concentration, total portfolio
      limits.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-27'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_exposure_manager_constraint.py
        -v
    - type: integration_test
      command: PYTHONPATH=src pytest tests/test_exposure_manager.py -v
    telemetry:
    - metric: exposure_check_blocks
      threshold: null
      alert: info
      description: Count of positions blocked by exposure limits
  - id: RISK-012
    title: TradeExecutor price validation must check both bounds
    description: '_validate_price() MUST reject entry prices outside (0, 1) range
      in addition to the max_entry_price upper bound. Prediction market prices are
      strictly between 0 and 1 exclusive. Prices of 0, negative, or >= 1.0 indicate
      data corruption or API errors.

      '
    rationale: 'Review 2026-02-28: _validate_price only checked upper bound (max_entry_price).
      With slippage disabled, a price of 0, -1, or 1.5 would pass through unchecked.
      SlippageEstimator validated 0 < price < 1 but only when enabled.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-28'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_price_bounds_validation.py
        -v
      description: Verify _validate_price checks both lower and upper bounds
  - id: RISK-013
    title: TradeExecutor must validate position size is positive
    description: 'execute_trade() MUST reject position_size <= 0 before proceeding
      to slippage estimation or execution. Zero or negative sizes indicate upstream
      bugs in position sizing logic.

      '
    rationale: 'Review 2026-02-28: No position size validation existed in TradeExecutor.
      A position_size of 0 or negative would pass through all validation stages and
      be saved to the database, corrupting position tracking.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-28'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_position_size_validation.py
        -v
      description: Verify execute_trade rejects non-positive position sizes
  - id: RISK-014
    title: API errors must use distinct rejection_stage from trade rejections
    description: 'When TradeExecutor cannot fetch orderbook or market data due to
      API failures, TradeResult.rejection_stage MUST be ''api_error'', not ''slippage''.
      This allows callers to distinguish transient API failures (retry-worthy) from
      legitimate trade rejections (skip trade).

      '
    rationale: 'Review 2026-02-28: API failures returned rejection_stage=''slippage'',
      same as legitimate slippage rejections. Bots logged "Trade rejected" and moved
      on, silently losing trading opportunities during temporary connectivity issues.
      With distinct stages, bots can implement retry logic for API errors.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-28'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_api_error_distinction.py
        -v
      description: Verify API failures use 'api_error' rejection_stage
  - id: RISK-015
    title: Positions with missing expiry data must be force-closed immediately
    description: 'If hours_to_expiry_at_entry is NULL/None in the database for an
      open position, the bot MUST force-close that position (via _execute_close or
      equivalent) rather than skip it or default to 0. A position with unknown expiry
      can never be safely monitored and will remain open indefinitely.

      '
    rationale: 'Bug fixed 2026-03-06 (C3): hours_to_expiry = pos.get("hours_to_expiry_at_entry")
      or 0

      evaluated to 0 when the column was NULL. The check "if hours_to_expiry > 0"
      was False, so the expiry branch was skipped entirely. Position stayed open forever,
      never checked for stop-loss, take-profit, or expiry.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-03-06'
    validation:
    - type: behavioral_test
      command: PYTHONPATH=src pytest tests/behavioral/test_missing_expiry_force_close.py
        -v
      description: Insert position with NULL hours_to_expiry; verify force-close is
        triggered
    telemetry:
    - metric: force_closes_missing_expiry
      threshold: null
      alert: warning
      description: Count of force-closes due to missing expiry data (should be 0 after
        clean DB)
  - id: RISK-016
    title: Current price must be validated non-None before any exit logic
    description: 'After fetching exit prices from PriceFetcher, the specific outcome
      price MUST be checked for None before being passed to should_exit(), P&L calculations,
      or any arithmetic. A None price must log a WARNING and skip the exit check for
      that cycle (not crash the position loop).

      '
    rationale: 'Bug fixed 2026-03-06 (C2): get_outcome_price() returns None when the
      token has no BID in the orderbook (illiquid outcome). Passing None to should_exit()
      caused TypeError: unsupported operand type(s) for -: float and NoneType, crashing
      the entire _check_positions() loop and leaving all positions unchecked.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-03-06'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_price_none_guard.py -v
      description: Verify None price guard exists before should_exit() calls in position
        loops
    telemetry:
    - metric: skipped_exit_checks_no_price
      threshold: null
      alert: info
      description: Count of exit checks skipped due to missing price (expected non-zero
        in illiquid markets)
  - id: RISK-010
    title: Input validation for all external data
    description: 'All data from external sources (API, WebSocket, user input) MUST
      be validated:


      Prices:

      - Not NaN, not Infinity

      - 0 < price < 1 (Polymarket binary outcomes)

      - Type check: isinstance(price, (int, float))


      Orderbooks:

      - Has ''timestamp'' field

      - Timestamp not stale (< orderbook_staleness_seconds config)

      - Bids/asks are lists of [price, size] pairs

      - All prices and sizes are valid numbers > 0


      Sizes:

      - order_size > 0

      - position_size > 0


      Raise ValueError immediately, do NOT process invalid data.

      '
    rationale: 'No validation existed for invalid inputs. Could have caused:

      - NaN propagation through calculations

      - Trading on stale orderbook data (10+ seconds old)

      - Negative position sizes

      - Division by zero errors


      Found during slippage estimator review 2026-02-27.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-27'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_input_validation.py -v
    telemetry:
    - metric: invalid_input_rejections
      threshold: null
      alert: info
      description: Count of invalid inputs rejected (expected to be non-zero)
  testing:
  - id: TEST-001
    title: All pytest commands must set PYTHONPATH=src
    description: "All pytest commands in CONSTRAINTS.yml MUST include PYTHONPATH=src\
      \ prefix:\n\n\u2705 Correct: PYTHONPATH=src pytest tests/integration/test_foo.py\
      \ -v\n\u274C Wrong:   pytest tests/integration/test_foo.py -v\n\nThis ensures\
      \ tests can import from src/ in CI/CD environments.\n"
    rationale: 'RISK-003 integration tests failed in CI with "ModuleNotFoundError:
      No module named ''core''".

      Local testing worked due to IDE PYTHONPATH, but CI/CD didn''t have it set.


      Discovered during constraint validation 2026-02-27.

      '
    status: enforced
    priority: medium
    implemented_date: '2026-02-27'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_pythonpath_constraint.py
        -v
    telemetry:
    - metric: pythonpath_violations
      threshold: 0
      alert: warning
      description: Count of test commands missing PYTHONPATH in CONSTRAINTS.yml
  - id: TEST-002
    title: Collector modules must have test coverage
    description: 'All collector modules (alchemy_collector, gdelt_collector, data_collector)

      MUST have corresponding test files with at least basic tests for init,

      API mocking, and error handling. Zero-test modules are FORBIDDEN.

      '
    rationale: '5 collector modules had zero tests. Bugs in collectors cause silent

      data quality degradation that only surfaces weeks later in model performance.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-28'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_collector_coverage.py -v
      description: Verify test files exist for all collector modules
    - type: integration_test
      command: PYTHONPATH=src pytest tests/integration/test_alchemy_collector.py tests/integration/test_gdelt_collector.py
        tests/integration/test_data_collector.py -v
      description: Run collector integration tests with mocked HTTP
  model_quality:
  - id: ML-001
    title: "Cross-validation (k\u22655) before model deployment"
    description: "All ML models MUST pass 5-fold walk-forward cross-validation before\
      \ deployment.\nProduction readiness criteria:\n  - ROC-AUC mean \u2265 0.70\n\
      \  - ROC-AUC std < 0.10\n  - Degradation (train AUC - test AUC) < 0.10\n"
    rationale: 'Walk-forward validation prevents lookahead bias (trains on past, tests
      on future).

      Production gates ensure models generalize to unseen data.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-09'
    validation:
    - type: pre_deployment_gate
      command: python3 scripts/validate_model_quality.py --model-path data/models/CANDIDATE_MODEL.pkl
      required_metrics:
        roc_auc_mean: '>= 0.70'
        roc_auc_std: < 0.10
        degradation: < 0.10
    telemetry:
    - metric: deployed_model_auc
      threshold: 0.7
      alert: critical
      description: Alert if deployed model AUC drops below 0.70
    - metric: days_since_last_retrain
      threshold: 30
      alert: warning
      description: Models should be retrained at least monthly
  - id: ML-002
    title: Feature drift detection and alerting
    description: "Feature importance MUST be tracked after each training run.\nAlert\
      \ on drift metrics:\n  - Kendall's Tau (rank stability) < 0.70 \u2192 Warning\n\
      \  - Top-5 overlap < 0.60 \u2192 Critical\n  - L1 distribution shift > 0.30\
      \ \u2192 Warning\n  - Importance drops (top feature < 50% of previous) \u2192\
      \ Critical\n"
    rationale: 'Early warning for model staleness, data quality issues, market regime
      changes.

      Prevents performance degradation before it impacts live trading.

      '
    status: enforced
    priority: high
    implemented_date: '2026-02-21'
    validation:
    - type: continuous_monitoring
      command: python3 scripts/analyze_feature_drift.py --bot-type event --lookback
        7
    telemetry:
    - metric: kendall_tau_rank_stability
      threshold: 0.7
      alert: warning
      description: Feature importance rank correlation vs baseline
    - metric: top_k_overlap
      threshold: 0.6
      alert: critical
      description: Overlap of top-5 features with baseline
    - metric: l1_distribution_shift
      threshold: 0.3
      alert: warning
    - metric: importance_drops_detected
      threshold: 0
      alert: critical
      description: Count of top features that lost >50% importance
  - id: ML-003
    title: Training labels use correct token-condition mapping
    description: "Label creation MUST use maker_asset_id \u2192 token_condition_map\
      \ \u2192 outcome_index.\nPrice-based heuristics (price > 0.5 = YES) are FORBIDDEN\
      \ - they create ~50% label errors.\n"
    rationale: 'Critical bug (2026-02-23): Old logic assumed price indicates outcome
      traded.

      Correct mapping: maker_asset_id identifies actual token purchased (YES vs NO).

      This fix improved model accuracy from 60% (random) to 95%.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-23'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/test_label_creation.py::TestLabelCreationTokenMapping::test_uses_token_condition_map
        -v
    - type: label_quality_check
      command: python3 scripts/validate_label_quality.py --sample-size 100
      description: Spot-check 100 random labels against known outcomes
  - id: ML-004
    title: Feature validation before ML prediction
    description: 'All features MUST be validated for NaN/Inf before being passed to
      ML models.

      Validation MUST occur at two levels:

      1. Bot level: Check model_features dict before creating DataFrame

      2. MLPredictor level: Defense-in-depth check in predict() method

      Invalid features MUST cause the prediction to be skipped, not produce garbage
      output.

      '
    rationale: 'np.std() on empty arrays returns NaN. Missing price histories leave
      NaN in features.

      Without validation, NaN propagates through ML pipeline producing meaningless

      predictions that the bot treats as valid trading signals.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-02-28'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_feature_validation.py -v
      description: Verify validate_features pattern exists before predict calls
    - type: integration_test
      command: PYTHONPATH=src pytest tests/integration/test_feature_nan_handling.py
        -v
      description: Test with NaN/Inf features to verify rejection
technical_debt:
  resolved:
  - id: DEBT-001
    title: Consolidate duplicated position management code
    description: 3 separate implementations (trader.py, trader_price_levels.py, trader_short_expiry.py)
    status: resolved
    resolved_date: '2026-02-14'
    impact: Eliminated ~500 lines of duplicate code
    validation:
    - type: filesystem_check
      command: test ! -f src/core/position_manager_v1.py
      description: Old V1 file should not exist
    - type: import_check
      command: '! grep -r ''import position_manager'' src/bots/ | grep -v ''position_manager.py'''
      description: All bots use unified position_manager.py
  - id: DEBT-002
    title: WebSocket reconnection logic
    description: No exponential backoff, limited retries
    status: resolved
    resolved_date: '2026-02-14'
    impact: "Exponential backoff (1s\u219260s), unlimited retries, \xB130% jitter"
    validation:
    - type: integration_test
      command: PYTHONPATH=src pytest tests/integration/test_websocket_reconnection.py
        -v
  - id: DEBT-003
    title: Backup files cleanup
    description: Remove .backup files from repository
    status: resolved
    resolved_date: '2026-02-14'
    validation:
    - type: filesystem_check
      command: '! find src/ -name ''*.backup'' | grep .'
      description: No .backup files should exist
  active:
  - id: DEBT-004
    title: Separate YES/NO price tracking
    description: 'Currently only tracking YES price as market probability proxy.

      Should track both YES and NO prices separately for better momentum detection.

      '
    status: planned
    priority: medium
    effort_hours: 2
    blocked_by: []
    acceptance_criteria:
    - PriceTracker accepts {market_id}_YES and {market_id}_NO tracking IDs
    - Feature extractors handle both price histories
    - Tests verify YES/NO momentum signals work independently
    suggested_implementation: 'self.price_tracker.track_price(f"{market_id}_YES",
      entry_prices.yes_price)

      self.price_tracker.track_price(f"{market_id}_NO", entry_prices.no_price)

      '
operations:
- id: OPS-001
  title: Bot health monitoring with liveness detection
  description: 'BotHealthMonitor MUST run checks every 15 minutes.

    Alert on: silent bots (>30 min), collection rate drops (>50%), database corruption.

    '
  status: enforced
  priority: high
  implemented_date: '2026-02-15'
  validation:
  - type: integration_test
    command: PYTHONPATH=src pytest tests/integration/test_bot_health_monitor.py -v
  telemetry:
  - metric: bots_silent
    threshold: 0
    alert: critical
    description: Count of bots without activity >30 minutes
  - metric: collection_rate_drop
    threshold: 0.5
    alert: warning
    description: Alert if collection rate drops >50%
- id: OPS-002
  title: Position persistence across restarts
  description: 'All positions MUST persist in SQLite databases.

    Bots MUST reload positions on startup.

    No position loss allowed during restart/crash.

    '
  status: enforced
  priority: critical
  implemented_date: '2026-01-31'
  validation:
  - type: behavioral_test
    command: PYTHONPATH=src pytest tests/behavioral/test_position_persistence.py -v
  telemetry:
  - metric: positions_lost_on_restart
    threshold: 0
    alert: critical
- id: OPS-003
  title: No documentation bloat - code is the documentation
  description: 'Only README.md and CONSTRAINTS.yml allowed as markdown docs.

    No feature docs, completion summaries, or guides.

    Code + tests + git commits are self-documenting.

    '
  rationale: 'Documentation rot is worse than no documentation.

    Markdown docs duplicate information, become stale, and create maintenance burden.

    Well-designed systems don''t need explanatory documentation.

    '
  status: enforced
  priority: high
  implemented_date: '2026-02-25'
  validation:
  - type: filesystem_check
    command: bash scripts/check_no_doc_bloat.sh
    description: Verify only allowed .md files exist
  forbidden_patterns:
  - '*COMPLETE.md'
  - '*SUMMARY.md'
  - '*GUIDE.md'
  - docs/*.md
  allowed_files:
  - README.md
  - CONSTRAINTS.yml
  - IMPROVEMENT_CHECKLIST.md
- id: OPS-004
  title: Automated model retraining enforced
  description: "Automated retraining system MUST successfully retrain and deploy models.\n\
    Retraining triggers:\n  - Model age > 25 days (5-day buffer before 30-day threshold)\n\
    \  - Deployed model AUC < 0.70\n  - Significant feature drift detected\n\nQuality\
    \ gates (must pass to deploy):\n  - ROC-AUC >= 0.70\n  - Accuracy >= 0.60\n"
  rationale: 'Prevents model staleness without manual intervention.

    Ensures models stay current with market conditions and data distributions.

    Automatic backups enable safe rollback on deployment failure.

    '
  status: enforced
  priority: high
  implemented_date: '2026-02-26'
  validation:
  - type: integration_test
    command: PYTHONPATH=src pytest tests/test_auto_retraining.py -v
    description: Verify retraining triggers, training, validation, deployment
  - type: cli_check
    command: python scripts/auto_retrain.py --check
    description: Check retraining triggers via CLI
  telemetry:
  - metric: last_successful_retrain
    alert_on_change: true
    alert: info
    description: Log when automated retraining completes
  - metric: retrain_failures_consecutive
    threshold: 2
    alert: critical
    description: Alert if retraining fails 2+ times consecutively
- id: OPS-006
  title: SQLite databases must use WAL journal mode
  description: 'All SQLite databases in this project MUST be initialized with PRAGMA
    journal_mode=WAL. DELETE journal mode is FORBIDDEN.

    WAL provides: - Concurrent readers while writing (no reader-blocks-writer) - Crash-safe
    partial writes (WAL is atomic) - Better throughput under simultaneous read/write
    load from multiple services

    The _checkpoint_db() method MUST use PRAGMA wal_checkpoint(TRUNCATE) rather than
    PRAGMA optimize.

    '
  rationale: 'Bug fixed 2026-03-06 (H2): gdelt_collector.py used DELETE journal mode
    with a misleading comment "more compatible with macOS than WAL". This caused the
    GDELT DB corruption incident (backup file still present). WAL mode prevents the
    partial-write corruption that DELETE mode allows when the process is killed mid-write.

    '
  status: enforced
  priority: high
  implemented_date: '2026-03-06'
  validation:
  - type: structural_test
    command: PYTHONPATH=src pytest tests/structural/test_wal_journal_mode.py -v
    description: Grep all SQLite init code; verify journal_mode=WAL, no journal_mode=DELETE
  forbidden_patterns:
  - journal_mode=DELETE
  - journal_mode=TRUNCATE
  - journal_mode=PERSIST
  files_to_check:
  - src/collectors/gdelt_collector.py
  - src/collectors/alchemy_collector.py
  - src/core/position_manager_v2.py
  telemetry:
  - metric: db_journal_mode_violations
    threshold: 0
    alert: critical
    description: Count of databases not using WAL mode
- id: OPS-007
  title: In-memory cooldown/cache dicts must be bounded with periodic cleanup
  description: 'Any in-memory dict used for cooldowns, caches, or rate-limiting (e.g.
    market_cooldowns, market_cache) MUST be purged of expired entries at least once
    per main cycle. The purge MUST use a TTL derived from config, not a hardcoded
    constant.

    Unbounded dicts that grow monotonically are FORBIDDEN in long-running bots.

    '
  rationale: "Bug fixed 2026-03-06 (M3): market_cooldowns in trader_short_expiry.py\
    \ accumulated one entry per closed position, never evicted. In a 30-day run at\
    \ ~10 closures/day this would reach 300 entries \u2014 trivial for memory but\
    \ indicative of a leak pattern. The same dict pattern elsewhere (market_cache)\
    \ is higher risk because it stores full market data.\n"
  status: enforced
  priority: medium
  implemented_date: '2026-03-06'
  validation:
  - type: structural_test
    command: PYTHONPATH=src pytest tests/structural/test_bounded_dicts.py -v
    description: Verify cooldown/cache dicts have cleanup code in the main loop
  telemetry:
  - metric: market_cooldowns_size
    threshold: 500
    alert: warning
    description: Alert if cooldowns dict exceeds 500 entries (likely cleanup not working)
- id: OPS-008
  title: Fallback logic must log WARNING when activated
  description: 'Any silent fallback that substitutes a default value for a missing
    or unexpected value MUST log at WARNING level (not DEBUG or INFO) including: the
    field name, the position/market identifier, the fallback value chosen, and ideally
    the source (DB column, metadata, hardcoded).

    Silent fallbacks that apply wrong parameters without logging are FORBIDDEN.

    '
  rationale: 'Bug found 2026-03-06 (M1): bucket column missing from old positions
    silently fell back to "short" without any log entry. This applied short-bucket
    TP/SL thresholds to ultra_short and medium positions, producing systematically
    wrong exit behaviour that was invisible in logs.

    '
  status: enforced
  priority: medium
  implemented_date: '2026-03-06'
  validation:
  - type: structural_test
    command: PYTHONPATH=src pytest tests/structural/test_fallback_logging.py -v
    description: Verify fallback branches in _check_positions use logger.warning,
      not logger.debug
  telemetry:
  - metric: bucket_fallback_warnings
    threshold: null
    alert: info
    description: Count of positions that triggered bucket fallback (should drop to
      0 as old positions close)
- id: OPS-009
  title: No hardcoded credentials in config files or source code
  description: 'API tokens, bot tokens, private keys, and chat IDs MUST NOT be hardcoded
    in: - JSON config files (config/*.json) - Python source files - Docker Compose
    environment sections

    All credentials MUST be read from environment variables at runtime. The config
    file MAY contain the env var name as documentation, but the actual secret value
    MUST be empty or a placeholder (e.g. "").

    Bots MUST prefer the environment variable over any config-file value: os.environ.get("SECRET_NAME",
    config.get("field", ""))

    '
  rationale: 'Bug fixed 2026-03-06 (L2): config/config_short_expiry.json contained
    a live Telegram bot token in plaintext. Any git clone, log grep, or docker inspect
    would expose the credential. Secrets in config files also cannot be rotated without
    a code change and commit.

    '
  status: enforced
  priority: critical
  implemented_date: '2026-03-06'
  validation:
  - type: structural_test
    command: PYTHONPATH=src pytest tests/structural/test_no_hardcoded_credentials.py
      -v
    description: Regex scan config/*.json and src/ for patterns matching API keys,
      bot tokens
  - type: pre_commit_hook
    description: git-secrets or similar pre-commit hook to block credential commits
  forbidden_patterns:
  - \d{8,}:[A-Za-z0-9_-]{35}
  - bot_token.*[A-Za-z0-9]{35}
  files_to_check:
  - config/config_short_expiry.json
  - config/config.json
  - config/config_price_levels.json
  - config/config_arbitrage.json
  - docker-compose.yml
  telemetry:
  - metric: credential_scan_violations
    threshold: 0
    alert: critical
    description: Count of detected hardcoded credentials (must be zero at all times)
- id: OPS-005
  title: Database integrity check at startup
  description: 'All SQLite databases used in critical-path operations MUST run

    PRAGMA integrity_check at initialization. If the check fails, the bot MUST

    refuse to start rather than operate on corrupted data.

    '
  rationale: 'ML-002 validation failed due to malformed feature_importance_tracker.db.

    Without integrity checks, corrupted databases cause silent data corruption

    and misleading results. Early detection prevents cascading failures.

    '
  status: enforced
  priority: high
  implemented_date: '2026-02-28'
  validation:
  - type: structural_test
    command: PYTHONPATH=src pytest tests/structural/test_db_integrity_check.py -v
    description: Verify PRAGMA integrity_check in critical-path DB init methods
  telemetry:
  - metric: db_integrity_failures
    threshold: 0
    alert: critical
    description: Number of databases that failed integrity check at startup
  - id: ARCH-018
    title: Prediction market filter thresholds must match market microstructure
    description: 'Quality filter thresholds for prediction markets MUST use values
      calibrated to Polymarket microstructure, not equity market conventions.

      max_spread_pct MUST be >= 20% for all buckets (binary prediction markets have
      10-30% half-spread at mid, far wider than equity markets).

      min_price/max_price MUST be <= 0.02 / >= 0.98 to include near-certain outcomes
      (crypto binary markets near 0 or 1 have valid momentum signals).

      Thresholds of < 10% spread or price bounds of 0.05/0.95 are FORBIDDEN.

      '
    rationale: 'Bug fixed 2026-03-06: max_spread_pct was 6-10% (equity convention),
      killing 91-97% of discoverable markets before signal generation. min_price/max_price
      of 0.05/0.95 excluded crypto binary markets that price near certainty — exactly
      where edge is highest. Result: zero trades despite 160-220 discovered markets.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-03-06'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_filter_thresholds.py -v
      description: Verify max_spread_pct >= 20 and min/max price bounds in all bot
        configs
    forbidden_patterns:
    - '"ultra_short": [0-9]\.'
    - '"short": [0-9]\.'
    - '"medium": [0-9]\.'
    files_to_check:
    - config/config_short_expiry.json
    telemetry:
    - metric: quality_filter_survival_rate
      threshold: 0.3
      alert: warning
      description: Alert if < 30% of discovered markets pass quality filter (thresholds
        likely too tight)
  - id: ARCH-019
    title: check_last_trade must be configurable, not hardcoded
    description: 'The check_last_trade parameter in MarketFilter.filter_by_quality()
      MUST be driven by a config value (e.g. require_last_trade_price) and NOT hardcoded
      to True.

      Hardcoding True silently rejects newly-listed markets that lack lastTradePrice
      history, reducing the candidate pool without any log evidence.

      Default for short-expiry bot MUST be False (prefer inclusion).

      '
    rationale: 'Bug fixed 2026-03-06: _filter_tradeable() had check_last_trade=True
      hardcoded. Newly-listed crypto markets have no lastTradePrice, causing silent
      rejection. Configurable flag allows operators to tune inclusion vs quality trade-off
      without code changes.

      '
    status: enforced
    priority: high
    implemented_date: '2026-03-06'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_check_last_trade_configurable.py
        -v
      description: Verify _filter_tradeable reads check_last_trade from config, not
        hardcoded
    forbidden_patterns:
    - check_last_trade=True
    files_to_check:
    - src/bots/trader_short_expiry.py
  - id: ARCH-020
    title: Momentum features must seed from available market data on empty history
    description: 'When price_history is empty (bot fresh start), MomentumFeatures.extract()
      MUST compute a proxy price_change_1h using (live_mid - lastTradePrice) / lastTradePrice
      where live_mid = (bestAsk + bestBid) / 2.

      Returning 0.0 for all momentum features on empty history is FORBIDDEN because
      it permanently suppresses momentum signals for the first hour of operation, preventing
      any trades regardless of actual price movement.

      '
    rationale: 'Bug fixed 2026-03-06: On fresh bot start, PriceTracker has no history
      so price_change_1h=0.0. The momentum rule "abs(price_change_1h) > 0.02" always
      evaluates to False, blocking all momentum signals for the first 12 cycles (~1h).
      Markets with real price movement were ignored. Seeding from lastTradePrice vs
      live mid provides a reasonable proxy for recent movement.

      '
    status: enforced
    priority: high
    implemented_date: '2026-03-06'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_momentum_seed_empty_history.py
        -v
      description: Verify MomentumFeatures.extract returns non-zero price_change_1h
        when history empty but lastTradePrice and bestAsk/bestBid present
  - id: RISK-017
    title: can_execute balance check must use min_position_size, not max_position_size
    description: 'The balance sufficiency check in can_execute() MUST compare balance
      against min_position_size (not max_position_size).

      The check MUST be: if balance < min_position_size: return False

      Using max_position_size in the comparison is FORBIDDEN — it blocks valid small
      positions when balance is between min and max, producing zero trades even with
      ample capital.

      '
    rationale: 'Bug fixed 2026-03-06: can_execute had "if max_position_size > balance:
      return False". With ultra_short max=$50 and balance=$49, this blocked all positions
      even though a $10 minimum position was feasible. Logic was inverted: it rejected
      trades when max > balance instead of when balance < min. Result: zero trades
      when balance dropped even slightly below any bucket max.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-03-06'
    validation:
    - type: structural_test
      command: PYTHONPATH=src pytest tests/structural/test_can_execute_balance_check.py
        -v
      description: Verify can_execute uses min_position_size in balance guard
    - type: behavioral_test
      command: PYTHONPATH=src pytest tests/behavioral/test_can_execute_with_partial_balance.py
        -v
      description: Verify can_execute returns True when balance >= min but < max
    forbidden_patterns:
    - max_position_size.*balance
    - max_size > balance
    files_to_check:
    - src/bots/trader_short_expiry.py
    telemetry:
    - metric: trades_blocked_balance_check
      threshold: null
      alert: info
      description: Count of trades blocked by balance check (should reflect true
        insufficient funds, not max_size misfire)
  - id: OBS-001
    title: Market discovery funnel stages must be recorded to telemetry
    description: 'All three bots (event_trader, short_expiry_*, price_level_trader)
      MUST record market counts at each discovery funnel stage to telemetry.db using
      record_market_discovery_funnel() from monitoring.telemetry_helpers.

      Required stages: api_fetched, event_fetched, combined, after_quality (plus
      after_category for event_trader, after_expiry for price_level_trader).

      filter_by_quality() MUST be called with source= so rejection breakdowns are
      also recorded via record_quality_rejections().

      Removing or skipping funnel recording is FORBIDDEN.

      '
    rationale: 'Implemented 2026-03-06: Bots previously logged funnel counts to stdout
      only — ephemeral and unqueryable. Without persistent time-series metrics it is
      impossible to detect when a config change silently kills 90%+ of candidates.

      '
    status: enforced
    priority: high
    implemented_date: '2026-03-06'
    validation:
    - type: grep
      pattern: record_market_discovery_funnel
      files_to_check:
      - src/bots/trader.py
      - src/bots/trader_short_expiry.py
      - src/bots/trader_price_levels.py
      description: Verify funnel recording calls exist in all three bots
    telemetry:
    - metric: funnel_event_trader_after_quality
      threshold: null
      alert: info
      description: Final tradeable market count for event trader after all filters
    - metric: funnel_short_expiry_ultra_short_after_quality
      threshold: null
      alert: info
      description: Final tradeable market count for ultra_short bucket
    - metric: funnel_price_level_trader_after_quality
      threshold: null
      alert: info
      description: Final tradeable market count for price-level trader
  - id: RISK-018
    title: risk_management.min_edge must not exceed any rule's min_edge
    description: 'The global risk_management.min_edge threshold MUST be <= the minimum
      min_edge value across all signal rules (arbitrage, momentum, mean_reversion).

      Setting risk_management.min_edge HIGHER than a rule''s min_edge is FORBIDDEN
      because it silently discards valid signals that passed the rule threshold —
      the bot generates the signal, then can_execute() drops it with no log.

      In config_short_expiry.json: risk_management.min_edge MUST be <= 0.02
      (matching rules.arbitrage.min_edge).

      '
    rationale: 'Bug fixed 2026-03-06: risk_management.min_edge=0.05 > rules.arbitrage.min_edge=0.02.
      Every arbitrage signal (edge 0.02-0.05) was silently rejected by can_execute().
      Zero arbitrage trades executed despite valid opportunities being detected.

      '
    status: enforced
    priority: critical
    implemented_date: '2026-03-06'
    validation:
    - type: structural_test
      command: python3 -c "import json; c=json.load(open('config/config_short_expiry.json'));
        rm=c['risk_management']['min_edge']; arb=c['rules']['arbitrage']['min_edge'];
        assert rm<=arb, f'min_edge mismatch: risk_mgmt={rm} > arbitrage={arb}'; print('OK')"
      description: Verify risk_management.min_edge <= rules.arbitrage.min_edge
    forbidden_patterns:
    - '"min_edge": 0\.[1-9]'
    files_to_check:
    - config/config_short_expiry.json
  - id: PERF-001
    title: Orderbook subscription clients must have a circuit breaker
    description: 'Any client that calls a remote orderbook subscription endpoint
      MUST implement a circuit breaker that:

      1. Tracks consecutive connection failures.

      2. After >= 3 consecutive failures, marks the service unavailable for >= 60s.

      3. Returns immediately (no network call) while in the back-off window.

      Blocking N × timeout_seconds per discovery cycle without a circuit breaker
      is FORBIDDEN when N is the number of markets to register.

      '
    rationale: 'Bug fixed 2026-03-06: OrderbookServiceClient.subscribe_market() had
      no circuit breaker. When orderbook service was down, 108 markets × 5s timeout
      = 9 minutes wasted per discovery cycle. _process_bucket() barely ran, so no
      trades were opened despite qualified markets existing.

      '
    status: enforced
    priority: high
    implemented_date: '2026-03-06'
    validation:
    - type: grep
      pattern: _cb_unavailable_until|circuit.breaker|CB_FAILURE_THRESHOLD
      files_to_check:
      - src/services/orderbook_client.py
      description: Verify circuit breaker state exists in orderbook client
