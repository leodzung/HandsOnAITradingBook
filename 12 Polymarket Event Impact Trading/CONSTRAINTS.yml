operations:
- id: OPS-001
  title: Bot health monitoring with liveness detection
  description: 'BotHealthMonitor MUST run checks every 15 minutes.

    Alert on: silent bots (>30 min), collection rate drops (>50%), database corruption.

    '
  status: enforced
  priority: high
  implemented_date: '2026-02-15'
  validation:
  - type: integration_test
    command: pytest tests/integration/test_bot_health_monitor.py -v
  telemetry:
  - metric: bots_silent
    threshold: 0
    alert: critical
    description: Count of bots without activity >30 minutes
  - metric: collection_rate_drop
    threshold: 0.5
    alert: warning
    description: Alert if collection rate drops >50%
- id: OPS-002
  title: Position persistence across restarts
  description: 'All positions MUST persist in SQLite databases.

    Bots MUST reload positions on startup.

    No position loss allowed during restart/crash.

    '
  status: enforced
  priority: critical
  implemented_date: '2026-01-31'
  validation:
  - type: behavioral_test
    command: pytest tests/behavioral/test_position_persistence.py -v
  telemetry:
  - metric: positions_lost_on_restart
    threshold: 0
    alert: critical
- id: OPS-003
  title: No documentation bloat - code is the documentation
  description: 'Only README.md and CONSTRAINTS.yml allowed as markdown docs.

    No feature docs, completion summaries, or guides.

    Code + tests + git commits are self-documenting.

    '
  rationale: 'Documentation rot is worse than no documentation.

    Markdown docs duplicate information, become stale, and create maintenance burden.

    Well-designed systems don''t need explanatory documentation.

    '
  status: enforced
  priority: high
  implemented_date: '2026-02-25'
  validation:
  - type: filesystem_check
    command: bash scripts/check_no_doc_bloat.sh
    description: Verify only allowed .md files exist
  forbidden_patterns:
  - '*COMPLETE.md'
  - '*SUMMARY.md'
  - '*GUIDE.md'
  - docs/*.md
  allowed_files:
  - README.md
  - CONSTRAINTS.yml
  - IMPROVEMENT_CHECKLIST.md
- id: OPS-004
  title: Automated model retraining enforced
  description: "Automated retraining system MUST successfully retrain and deploy models.\n\
    Retraining triggers:\n  - Model age > 25 days (5-day buffer before 30-day threshold)\n\
    \  - Deployed model AUC < 0.70\n  - Significant feature drift detected\n\nQuality\
    \ gates (must pass to deploy):\n  - ROC-AUC >= 0.70\n  - Accuracy >= 0.60\n"
  rationale: 'Prevents model staleness without manual intervention.

    Ensures models stay current with market conditions and data distributions.

    Automatic backups enable safe rollback on deployment failure.

    '
  status: enforced
  priority: high
  implemented_date: '2026-02-26'
  validation:
  - type: integration_test
    command: pytest tests/test_auto_retraining.py -v
    description: Verify retraining triggers, training, validation, deployment
  - type: cli_check
    command: python scripts/auto_retrain.py --check
    description: Check retraining triggers via CLI
  telemetry:
  - metric: last_successful_retrain
    alert_on_change: true
    alert: info
    description: Log when automated retraining completes
  - metric: retrain_failures_consecutive
    threshold: 2
    alert: critical
    description: Alert if retraining fails 2+ times consecutively
