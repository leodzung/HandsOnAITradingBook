name: Fast Checks

# Optimized workflow for quick feedback
# Runs critical checks in parallel, fails fast on violations

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  # Job 1: Structural tests (FAST - 10s)
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-structural-${{ hashFiles('**/requirements*.txt') }}

    - name: Install minimal dependencies
      working-directory: "12 Polymarket Event Impact Trading"
      run: |
        pip install pytest pytest-cov

    - name: Run structural tests
      working-directory: "12 Polymarket Event Impact Trading"
      run: |
        pytest tests/structural/ -v --tb=short

  # Job 2: Architecture constraints (FAST - 5s)
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
    - uses: actions/checkout@v3

    - name: Check PriceFetcher constraint
      working-directory: "12 Polymarket Event Impact Trading"
      run: |
        # Check for direct market price access
        if grep -r "market\.get.*bestBid\|bestAsk\|outcomePrices" src/bots/*.py; then
          echo "❌ Direct market price access detected"
          exit 1
        fi
        echo "✅ No violations found"

    - name: Check PositionManager constraint
      working-directory: "12 Polymarket Event Impact Trading"
      run: |
        # Check for direct sqlite3 imports in bots
        if grep -r "import sqlite3" src/bots/*.py; then
          echo "❌ Direct sqlite3 import in bots"
          exit 1
        fi
        echo "✅ No violations found"

  # Job 3: Unit tests (MEDIUM - 30s)
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-unit-${{ hashFiles('**/requirements*.txt') }}

    - name: Install dependencies
      working-directory: "12 Polymarket Event Impact Trading"
      run: |
        pip install -r requirements-test.txt

    - name: Run unit tests
      working-directory: "12 Polymarket Event Impact Trading"
      run: |
        pytest tests/test_*.py -v --tb=short -m "not slow"

  # Job 4: Critical integration tests (MEDIUM - 45s)
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-integration-${{ hashFiles('**/requirements*.txt') }}

    - name: Install dependencies
      working-directory: "12 Polymarket Event Impact Trading"
      run: |
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Create test databases
      working-directory: "12 Polymarket Event Impact Trading"
      run: |
        mkdir -p data
        touch data/positions.db
        touch data/positions_price_level.db

    - name: Run critical integration tests
      working-directory: "12 Polymarket Event Impact Trading"
      run: |
        pytest tests/integration/test_position_monitoring.py -v --tb=short
        pytest tests/behavioral/test_circuit_breaker.py -v --tb=short
        pytest tests/integration/test_slippage_estimation.py -v --tb=short

  # Summary job - requires all to pass
  all-checks:
    runs-on: ubuntu-latest
    needs: [structural, architecture, unit-tests, integration-tests]
    if: always()

    steps:
    - name: Check results
      run: |
        if [ "${{ needs.structural.result }}" != "success" ] || \
           [ "${{ needs.architecture.result }}" != "success" ] || \
           [ "${{ needs.unit-tests.result }}" != "success" ] || \
           [ "${{ needs.integration-tests.result }}" != "success" ]; then
          echo "❌ Some checks failed"
          exit 1
        fi
        echo "✅ All checks passed!"
